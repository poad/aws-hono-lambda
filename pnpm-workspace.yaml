packages:
  - ./cdk
  - ./app

allowBuilds:
  esbuild: false
  unrs-resolver: false

audit:
  level: moderate
  ignore:
    - GHSA-g3hv-75wg-m249

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.20.0

overrides:
  chokidar: '>=5'
  semver: '>=7'

trustPolicy: no-downgrade
